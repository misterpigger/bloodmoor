name: fetch-models
on:
  push:
    branches: [fetch-models]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u tools/fetch_sounds.py /tmp/sounds
        env:
          PER: "4"
          IDS: ""
          QUERIES: "blood splatter|blood splash|gore splat|flesh impact|blood squirt|gurgle|choking gurgle|blood gurgle|dying breath|wet squelch"
      - name: Commit to the sfx-raw branch
        run: |
          cd /tmp/sounds
          git init -q -b sfx-raw3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "freesound CC0 previews, fetched by workflow"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sfx-raw3
