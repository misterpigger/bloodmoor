name: fetch-models
on:
  push:
    branches: [fetch-models]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_sounds.py /tmp/sounds
        env:
          PER: "4"
          QUERIES: "forest birds ambience|songbirds morning ambience|crows cawing|owl hoot night|wind trees ambience|wind gusts outdoor|cave ambience drips|dungeon ambience|crypt ambience|water drip cave|tavern ambience crowd|medieval crowd cheering|crowd gasp|seagulls|ocean waves ship|wooden ship creaking|rain heavy|thunder|river stream|water wheel mill|fire crackle torch|night crickets ambience|village ambience medieval|dog barking distance|church bell distant|horse whinny|chainmail movement|armor plate movement|cloth movement foley|sword whoosh|sword unsheathe|sword clash|sword hit flesh|blade stab flesh|bone break crack|body fall dirt|footsteps gravel|footsteps wood|footsteps stone|male grunt effort|male pain scream|male death|breathing heavy exhausted|wooden door creak|chain rattle|torch whoosh"
      - name: Commit to the sfx-raw branch
        run: |
          cd /tmp/sounds
          git init -q -b sfx-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "freesound CC0 previews, fetched by workflow"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sfx-raw
