name: fetch-models
on:
  push:
    branches: [fetch-models]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_polyhaven_textures.py /tmp/out
      - name: Commit to the scratch branch
        run: |
          cd /tmp/out
          git init -q -b tex-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Poly Haven CC0 textures (1k), fetched by workflow"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" tex-raw
