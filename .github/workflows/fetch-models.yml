name: fetch-models
on:
  push:
    branches: [fetch-models]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_polyhaven_models.py /tmp/models
        env:
          IDS: brass_candleholders wooden_candlestick brass_goblets brass_pot_01 brass_pot_02 brass_pan_01 carved_wooden_plate metal_jug large_iron_gate gothic_statue marble_bust_01 lion_head vintage_oil_lamp picke_dirty_01 rusted_spade_01 sledgehammer_01 hatchet wooden_bookshelf_worn wooden_bowl_02 wooden_table_02 round_wooden_table_01 folding_wooden_stool rock_face_01 rock_face_02 stone_01 rock_07 rock_09 namaqualand_stones_01 dry_branches_medium_01 antique_ceramic_vase_01 ceramic_pot wooden_spoon wooden_cutting_board wooden_stool_01 Lantern_01 wooden_display_shelves_01 GothicCommode_01 wooden_hammer_01 wooden_broom planter_pot_clay
      - name: Commit the models to the models-raw2 branch
        run: |
          cd /tmp/models
          git init -q -b models-raw2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Poly Haven CC0 models (1k glTF), fetched by workflow"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" models-raw2
