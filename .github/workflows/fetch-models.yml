name: fetch-models
on:
  push:
    branches: [fetch-models]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Weapon and armour models
        run: python3 tools/fetch_assets.py /tmp/out
        env:
          PH_RES: 2k
          PH_IDS: ""
          URLS: |
            arming_oak https://zenodo.org/records/10282988/files/6f41723835684677bdfcbd154df5370e.glb?download=1
            long_mkostal https://zenodo.org/records/10256608/files/68fe42128e9b4cdf9719c2982f71b841.glb?download=1
            long_koyshem https://zenodo.org/records/10327649/files/a8b46cbcb24346b19c890cb521d4deba.glb?download=1
            barbute https://zenodo.org/records/10241751/files/5e3d0edb528e429e8f2e7b705423b0a9.glb?download=1
            sallet https://zenodo.org/records/10270149/files/647a0902810d407f80717c1ccc8aab43.glb?download=1
            mace_rival https://zenodo.org/records/10291212/files/1c4f718f257c44bebf6978d4ea01849d.glb?download=1
            axe_rival https://zenodo.org/records/10383419/files/1e906b6e5b7b4ebd8dd17dbf2a227d0a.glb?download=1
      - name: Commit to the assets-raw3 branch
        run: |
          cd /tmp/out
          git init -q -b assets-raw3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Weapon and armour models, fetched by workflow"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" assets-raw3
