name: fetch-models
on:
  push:
    branches: [fetch-models]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Weapon and armour models
        run: python3 tools/fetch_assets.py /tmp/out
        env:
          PH_RES: 2k
          PH_IDS: antique_estoc ornate_medieval_mace ornate_war_hammer ornate_medieval_dagger wooden_axe wooden_axe_02 wooden_axe_03 hatchet kite_shield
          URLS: ""
      - name: Commit to the assets-raw3 branch
        run: |
          cd /tmp/out
          git init -q -b assets-raw3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Weapon and armour models, fetched by workflow"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" assets-raw3
