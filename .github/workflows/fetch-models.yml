name: fetch-models
on:
  push:
    branches: [fetch-models]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u tools/fetch_sounds.py /tmp/sounds
        env:
          PER: "3"
          QUERIES: "english countryside birdsong|blackbird song|skylark|rooks crows distant|tawny owl|wind through trees|wind whistling|castle courtyard ambience|cave room tone drips|catacomb ambience|dripping water echo|medieval tavern ambience|pub crowd chatter|arena crowd roar|crowd gasp|seagulls harbour|waves wooden boat hull|ship creaking rope|heavy rain|distant thunder|river flowing|water wheel|fireplace crackle|torch burning|night crickets|village morning ambience|church bell toll|dog barking distant|rooster|chainmail rattle|armor clank movement|cloth rustle movement|sword swing whoosh|sword draw scabbard|sword clash metal|flesh stab|flesh impact|bone crack|body fall ground|footsteps gravel|footsteps wooden floor|footsteps stone|male grunt effort|male pain scream|male death scream|breathing heavy tired|wooden door creak|chains rattle"
      - name: Commit to the sfx-raw branch
        run: |
          cd /tmp/sounds
          git init -q -b sfx-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "freesound CC0 previews, fetched by workflow"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sfx-raw
