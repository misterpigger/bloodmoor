name: fetch-models
on:
  push:
    branches: [fetch-models]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_zenodo.py /tmp/models
        env:
          QUERIES: "plate armor|plate armour|gothic armor|knight armor|cuirass|breastplate|gauntlet|pauldron|sallet|bascinet|kettle hat|medieval helmet|greaves|medieval armor|gambeson|brigandine|chainmail|medieval knight"
          IDS: "10283409 10385915 10240288 10270149 10422508 10340873 10321683 10311214 10244104 10290833 10326058"
      - name: Commit to the zen-raw branch
        run: |
          cd /tmp/models
          git init -q -b zen-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Zenodo 3DBigDataSpace search results, fetched by workflow"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" zen-raw
